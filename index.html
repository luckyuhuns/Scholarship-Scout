<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scholarship Scout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
    <script>
      // Safe Shim for process.env in browser environments
      window.process = window.process || {};
      window.process.env = window.process.env || {};
      
      // Global Error Handler to debug White Screens on deployment
      window.addEventListener('error', function(event) {
        const root = document.getElementById('root');
        // Only display if the app hasn't mounted yet
        if (root && root.innerHTML.trim() === '') {
          const errorDiv = document.createElement('div');
          errorDiv.style.position = 'fixed';
          errorDiv.style.top = '0';
          errorDiv.style.left = '0';
          errorDiv.style.width = '100%';
          errorDiv.style.padding = '20px';
          errorDiv.style.backgroundColor = '#fee2e2';
          errorDiv.style.color = '#991b1b';
          errorDiv.style.fontFamily = 'monospace';
          errorDiv.style.zIndex = '9999';
          errorDiv.innerText = 'Application Startup Error: ' + (event.message || event);
          document.body.appendChild(errorDiv);
        }
      });
    </script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@0.1.2",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
